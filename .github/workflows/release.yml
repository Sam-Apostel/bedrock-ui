name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which package.json opts into.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # prepublishOnly runs the same verify chain; this makes a failure visible
      # as its own step rather than buried in npm's output.
      - run: npm run verify

      # NPM_TOKEN is optional: with trusted publishing configured on npm, the
      # OIDC token from `id-token: write` authenticates on its own and the env
      # var is simply empty. See RELEASING.md.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
