name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # The action opens and updates the version PR.
      contents: write
      pull-requests: write
      # Required for npm provenance, which package.json opts into.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets needs history to work out what has been released.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Gate both paths on the same chain CI runs. prepublishOnly runs it again
      # at publish time; this makes a failure its own step rather than something
      # buried in npm's output.
      - run: npm run verify

      # Two behaviours in one action, decided by whether changesets are pending:
      #
      #   changesets present → open or update a "Version Packages" PR that bumps
      #                        the version and writes CHANGELOG.md
      #   none present       → the version PR was merged, so publish
      #
      # Nobody types a version number, and nothing publishes without a changeset
      # describing why.
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: 'Version packages'
          title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
