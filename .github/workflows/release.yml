name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # The action opens and updates the version PR.
      contents: write
      pull-requests: write
      # The OIDC token npm exchanges for publish rights under trusted
      # publishing, and what provenance is signed against.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets needs history to work out what has been released.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14; `22` resolves to the latest
          # 22.x, which is well past that.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # The npm bundled with Node 22 is 10.x, and trusted publishing needs
      # >= 11.5.1. Without this the OIDC exchange never happens and publishing
      # falls back to looking for a token — which fails quietly once the token
      # has been removed.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Gate both paths on the same chain CI runs. prepublishOnly runs it again
      # at publish time; this makes a failure its own step rather than something
      # buried in npm's output.
      - run: npm run verify

      # Two behaviours in one action, decided by whether changesets are pending:
      #
      #   changesets present → open or update a "Version Packages" PR that bumps
      #                        the version and writes CHANGELOG.md
      #   none present       → the version PR was merged, so publish
      #
      # Nobody types a version number, and nothing publishes without a changeset
      # describing why.
      #
      # Needs "Allow GitHub Actions to create and approve pull requests" under
      # Settings → Actions → General, or opening the version PR fails.
      - uses: changesets/action@v2
        with:
          version-script: npm run version
          publish-script: npm run release
          commit-message: 'Version packages'
          pr-title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only used until trusted publishing is configured on npm; after that
          # the secret can be deleted and this line left as-is, since an unset
          # secret is an empty string and npm ignores it.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
