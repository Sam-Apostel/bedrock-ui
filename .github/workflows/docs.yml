name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued run replaces an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `enablement: true` below turns Pages on through the API, which is a
      # write to repository settings rather than to the site.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site serves r/ as well as the docs, so a stale registry would ship
      # silently. Rebuild it and fail if the committed copy disagrees.
      - run: npm run registry:build
      - run: git diff --exit-code r/

      - run: npm run docs:build

      # Turns Pages on, with Actions as the source, if it is not on already.
      # Without this the first run of this workflow on a fresh repository fails
      # with "Get Pages site failed ... Not Found", which reads like a broken
      # workflow rather than a setting nobody has touched yet. It is idempotent:
      # once Pages is on, this is a no-op that reports the existing site.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
