name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      # The packaging guarantees. A convenience re-export from src/index.ts into
      # the controlled layer would break the exports-map promise without
      # changing a single public type, so it is checked rather than trusted.
      - run: npm run lint:graph

      - run: npm run build
      - run: npm test

      # r/ is generated from registry.json plus the component sources; a
      # component edited without regenerating would ship a stale registry.
      - run: npm run registry:build
      - run: git diff --exit-code r/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
